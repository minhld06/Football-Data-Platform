services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

  minio:
    image: quay.io/minio/minio:latest
    container_name: footballdataplatform-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  crawlers:
    build:
      context: .
      dockerfile: crawlers/Dockerfile
    container_name: footballdataplatform-crawlers
    env_file:
      - .env
    environment:
      # Determines the local time used to name raw files (see crawlers/common/utils.py::save_raw).
      # Change based on where the crawl is running, e.g. "Europe/Paris" if crawling from France.
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    working_dir: /app
    init: true
    shm_size: "1gb"
    profiles:
      - tools # does not auto-start with "docker compose up"
  
  ingestion:
    build:
      context: .
      dockerfile: ingestion/Dockerfile
    container_name: footballdataplatform-ingestion-1
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/football
      RAW_DATA_DIR: /app/data/raw
    volumes:
      - ./data/raw:/app/data/raw:ro
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools   # does not auto-start with "docker compose up"
  
  dbt:
    build:
      context: .
      dockerfile: transform/Dockerfile
    container_name: footballdataplatform-dbt
    env_file:
      - .env
    environment:
      DBT_HOST: postgres
      DBT_PROFILES_DIR: /app/transform
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools # does not auto-start with "docker compose up"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: footballdataplatform-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/football
      FRONTEND_ORIGIN: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  minio_data:
  pgadmin_data: