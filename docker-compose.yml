services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

  minio:
    image: quay.io/minio/minio:latest
    container_name: footballdataplatform-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
  

  iceberg-rest:
    image: tabulario/iceberg-rest:latest
    container_name: footballdataplatform-iceberg-rest
    environment:
      CATALOG_URI: jdbc:postgresql://postgres:5432/iceberg_catalog
      CATALOG_JDBC_USER: ${POSTGRES_USER}
      CATALOG_JDBC_PASSWORD: ${POSTGRES_PASSWORD}
      CATALOG_WAREHOUSE: s3://lakehouse/warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_REGION: us-east-1
    ports:
      - "8181:8181"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - lakehouse
  
  spark-master:
    image: apache/spark:3.5.9-scala2.12-java17-python3-ubuntu
    container_name: footballdataplatform-spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    environment:
      SPARK_NO_DAEMONIZE: "true"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./infra/spark/jars:/opt/spark/extra-jars:ro
      - ./infra/spark/jobs:/opt/spark/jobs:ro
    ports:
      - "7077:7077"
      - "8080:8080"
    profiles:
      - lakehouse

  spark-worker:
    image: apache/spark:3.5.9-scala2.12-java17-python3-ubuntu
    container_name: footballdataplatform-spark-worker
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      SPARK_NO_DAEMONIZE: "true"
    volumes:
      - ./infra/spark/jars:/opt/spark/extra-jars:ro
    ports:
      - "8081:8081"
    depends_on:
      - spark-master
    profiles:
      - lakehouse
  
  
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: footballdataplatform-clickhouse
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"
      - "9004:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    profiles:
      - lakehouse
  
  jupyter:
    image: jupyter/all-spark-notebook
    container_name: footballdataplatform-jupyter
    environment:
      JUPYTER_ENABLE_LAB: "yes"
    volumes:
      - ./infra/spark/jars:/home/jovyan/extra-jars:ro
    ports:
      - "8888:8888"
    depends_on:
      - spark-master
    profiles:
      - lakehouse

  crawlers:
    build:
      context: .
      dockerfile: crawlers/Dockerfile
    container_name: footballdataplatform-crawlers
    env_file:
      - .env
    environment:
      # Determines the local time used to name raw files (see crawlers/common/utils.py::save_raw).
      # Change based on where the crawl is running, e.g. "Europe/Paris" if crawling from France.
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    working_dir: /app
    init: true
    shm_size: "1gb"
    profiles:
      - tools # does not auto-start with "docker compose up"
  
  ingestion:
    build:
      context: .
      dockerfile: ingestion/Dockerfile
    container_name: footballdataplatform-ingestion-1
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/football
      RAW_DATA_DIR: /app/data/raw
    volumes:
      - ./data/raw:/app/data/raw:ro
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools   # does not auto-start with "docker compose up"
  
  dbt:
    build:
      context: .
      dockerfile: transform/Dockerfile
    container_name: footballdataplatform-dbt
    env_file:
      - .env
    environment:
      DBT_HOST: postgres
      DBT_PROFILES_DIR: /app/transform
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools # does not auto-start with "docker compose up"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: footballdataplatform-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/football
      CHATBOT_DATABASE_URL: postgresql://chatbot_ro:${CHATBOT_DB_PASSWORD}@postgres:5432/football
      FRONTEND_ORIGIN: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
  
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: footballdataplatform-frontend
    environment:
      API_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

  

volumes:
  pgdata:
  minio_data:
  pgadmin_data: