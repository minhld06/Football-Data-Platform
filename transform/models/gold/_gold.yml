version: 2

models:
  - name: league_standings
    description: "All league standings across sources. Grain is 1 row/(league, season, team_id).
                  Logic: take newest snapshot from football_data_org (row_number by ingestion_time desc)
                  then join with teams to get name, then left join with understat snapshot to get xG, xGA, xPTS.
                  "
    columns:
      - name: team_id
        tests:
          - not_null
      - name: league
        tests:
          - not_null

  - name: team_form_last_5_matches
    description: "All teams's form. Grain is 1 row/(league,team_id, season).
                  Logic: reshape silver.matches with union all to get for each team 5 most recent matches (status = FINISHED) 
                  (by utc_date). Form column (oldest -> newest) is reversed compared to football_data_org in staging.
                  "
    columns:
      - name: team_id
        tests:
          - not_null
      - name: matches_played
        tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
            
  
  - name: player_profile
    description: "One row per player: identity + a convenience 'most recent season's team' (not a
                  season-scoped fact — see gold.player_performance for that). Grain is 1 row/player_id.
                  Logic: player identity from silver.players, team_id/team_name/league from the
                  player's latest row in silver.player_team_season (max(season)). Materialized as a
                  view (not table like other gold models) so age stays correct at query time instead
                  of going stale between dbt builds.
                  "
    columns:
      - name: player_id
        tests:
          - unique
          - not_null

  - name: player_performance
    description: "Player stats: goals (statbunker) + assists/apps/minutes/xG/xA (understat), joined
                  onto identity from silver.players. Grain is 1 row/player_id. Logic: left join
                  silver.players (base) to latest-snapshot-deduped stg_statbunker__player_stats and
                  stg_understat__player_stats on player_id (row_number by ingestion_time desc, same
                  dedup pattern as gold.league_standings's understat join). Stat columns are NULL
                  when a player has no data from that source yet, or when name-matching couldn't
                  resolve player_id — see assert_player_names_mapped and docs/gold_data_contract.md.
                  "
    columns:
      - name: player_id
        tests:
          - unique
          - not_null

  - name: team_profile
    description: "One row per team: identity (name, short name, TLA) and current league. Grain is 1 row/team_id.
                  Logic: thin passthrough of silver.teams, materialized as a view (same pattern as
                  player_profile) so it stays in sync as silver.teams changes without a rebuild.
                  "
    columns:
      - name: team_id
        tests:
          - unique
          - not_null

  - name: match_results
    description: "One row per match with home/away team names denormalized in. Grain is 1 row/source_match_id.
                  Logic: silver.matches left-joined twice onto silver.teams for home_team_name/away_team_name,
                  so the API/frontend never needs to join at read time.
                  "
    columns:
      - name: source_match_id
        tests:
          - unique
          - not_null