version: 2

models:
  - name: league_standings
    columns:
      - name: team_id
        tests:
          - not_null
      - name: league
        tests:
          - not_null

  - name: team_form_last_5_matches
    columns:
      - name: team_id
        tests:
          - not_null
      - name: matches_played
        tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]