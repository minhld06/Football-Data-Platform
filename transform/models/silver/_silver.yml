version: 2

models:
  - name: teams
    description: "All teams from football_data_org (used by gold models). Grain is 1 row/team_id."
    columns:
      - name: team_id
        tests:
          - unique
          - not_null
      - name: team_name
        tests:
          - not_null
  
  - name: matches
    description: "All matches from football_data_org (used by gold models). Grain is 1 row/match."
    columns:
      - name: source_match_id
        tests:
          - unique
          - not_null
      - name: home_team_id
        tests:
          - relationships:
              arguments:
                to: ref('teams')
                field: team_id
      - name: away_team_id
        tests:
          - relationships:
              arguments:
                to: ref('teams')
                field: team_id

  - name: standings
    description: "Latest standings snapshot per team from football_data_org (used by gold models). 
                  Grain is 1 row/(league, season, team_id) — dedupes stg_football_data_org__standings by taking the row with the newest ingestion_time per team."
    columns:
      - name: team_id
        tests:
          - not_null
      - name: league
        tests:
          - not_null
      - name: season
        tests:
          - not_null
    
  - name: players
    description: "Player identity. Grain is 1 row/player_id. player_id is either football_data_org's
                  own numeric id (for the ~588 players it covers), or understat's native player id
                  + a fixed 100000000 offset for players understat knows about but football_data_org
                  has zero row for (e.g. Mohamed Salah) — see
                  docs/superpowers/specs/2026-08-03-player-identity-season-team-design.md. Dedup
                  between the two sources is by normalize_player_name() against football_data_org's
                  raw (pre-display-name-override) name, plus player_name_map.csv for exceptions.
                  Understat-anchored rows have NULL position/date_of_birth/nationality/shirt_number/
                  team_id — football_data_org is the only source with bio fields, and team_id is now
                  resolved per-season in silver.player_team_season, not stored here."
    columns:
      - name: player_id
        tests:
          - unique
          - not_null
      - name: player_name
        tests:
          - not_null