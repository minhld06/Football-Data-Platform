version: 2

models:
  - name: teams
    description: "All teams from football_data_org (used by gold models). Grain is 1 row/team_id."
    columns:
      - name: team_id
        tests:
          - unique
          - not_null
      - name: team_name
        tests:
          - not_null
  
  - name: matches
    description: "All matches from football_data_org (used by gold models). Grain is 1 row/match."
    columns:
      - name: source_match_id
        tests:
          - unique
          - not_null
      - name: home_team_id
        tests:
          - relationships:
              arguments:
                to: ref('teams')
                field: team_id
      - name: away_team_id
        tests:
          - relationships:
              arguments:
                to: ref('teams')
                field: team_id

  - name: standings
    description: "Latest standings snapshot per team from football_data_org (used by gold models). 
                  Grain is 1 row/(league, season, team_id) — dedupes stg_football_data_org__standings by taking the row with the newest ingestion_time per team."
    columns:
      - name: team_id
        tests:
          - not_null
      - name: league
        tests:
          - not_null
      - name: season
        tests:
          - not_null
    
  - name: players
    description: "Latest squad snapshot per player from football_data_org (used by gold models). 
                  Grain is 1 row/player_id - dedupes stg_football_data_org__players by taking the row with the newest ingestion_time per player, 
                  which also resolves transfers (most recent team wins)."
    columns:
      - name: player_id
        tests:
          - unique
          - not_null
      - name: player_name
        tests:
          - not_null