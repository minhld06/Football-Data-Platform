version: 2

models:
  - name: teams
    description: "All teams from football_data_org (used by gold models). Grain is 1 row/team_id."
    columns:
      - name: team_id
        tests:
          - unique
          - not_null
      - name: team_name
        tests:
          - not_null
  
  - name: matches
    description: "All matches from football_data_org (used by gold models). Grain is 1 row/match."
    columns:
      - name: source_match_id
        tests:
          - unique
          - not_null
      - name: home_team_id
        tests:
          - relationships:
              arguments:
                to: ref('teams')
                field: team_id
      - name: away_team_id
        tests:
          - relationships:
              arguments:
                to: ref('teams')
                field: team_id