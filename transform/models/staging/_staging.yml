version: 2

models:
  - name: stg_football_data_org__standings
    description: "Staging model for football-data.org standings data. Grain is 1 row/team/snapshot, 
                  taken from TOTAL in standings payload. At this grain, not unique - repeats per ingestion snapshot"
    columns:
      - name: team_id
        tests:
          - not_null
        description: "The team_id is the unique identifier for a team across sources in silver. It is used to join to the teams model."
      - name: league
        tests:
          - not_null
      - name: form
        description: "The form of the team (from football-data.org) at the time of the snapshot."

  - name: stg_football_data_org__matches
    description: "Staging model for football-data.org match data. Grain is 1 row/match/snapshot,
                  repeats per ingestion snapshot (e.g. re-crawled after a match progresses from
                  SCHEDULED to LIVE to FINISHED) — not unique at this grain. silver.matches dedups
                  to the latest snapshot per source_match_id via ingestion_time."
    columns:
      - name: source_match_id
        tests:
          - not_null
        description: "The source_match_id is the unique identifier for a match in football-data.org. Natural key then join with source to become composite key for matches model in silver."

  - name: stg_statbunker__standings
    description: "Staging model for StatBunker standings data. Grain is 1 row/team/snapshot."
    columns:
      - name: team_id
        tests:
          - not_null
        description: "teams don't have id in Statbunker, team_id here is from left join with team_name_map.csv, so possible NULL if name is not in the map -> raw_team_name is kept in the model for reference."

  - name: stg_understat__standings
    description: "Staging model for Understat standings data. Grain is 1 row/team/snapshot. Has xG,xGA, xPTS columns."
    columns:
      - name: team_id
        tests:
          - not_null
        description: "teams don't have id in Understat, team_id here is from left join with team_name_map.csv, so possible NULL if name is not in the map -> raw_team_name is kept in the model for reference."
  
  - name: stg_football_data_org__players
    description: "Staging model for football-data.org squad data. Grain is 1 row/player/snapshot.
                  Squad is current-only — the /v4/teams/{id} endpoint has no season param, so this
                  does not reflect a season-specific historical squad."
    columns:
      - name: player_id
        tests:
          - not_null
        description: "The player_id is the unique identifier for a player in football-data.org, used to join to the players model in silver."
      - name: team_id
        tests:
          - not_null
  
  - name: stg_statbunker__player_stats
    description: "Staging model for StatBunker top-scorer data. Grain is 1 row/player/snapshot.
                  Scraped per-club (statbunker has no competition-wide top-scorers page). team_id
                  resolved via team_name_map.csv (NULL if unmapped). This model no longer resolves
                  player_id itself — that moved to silver/player_team_season.sql (would create a
                  circular ref if this model depended on silver.players). statbunker has no native
                  player id of its own; every statbunker player has been confirmed to also appear in
                  understat under some spelling, so it never anchors a new identity, only supplies
                  supplementary stat columns (fh/sh/fs/ls/h/a) once player_team_season resolves whose
                  row this is."
    columns:
      - name: raw_player_name
        tests:
          - not_null

  - name: stg_understat__player_stats
    description: "Staging model for Understat player stats, fetched from Understat's own JSON data
                  endpoint (getLeagueData/{league}/{season}) rather than scraped from the on-page
                  table — that table is client-side paginated at 10 rows/page (~50+ pages for a full
                  league), so the endpoint is used directly to get the full roster in one response.
                  xg90/xa90 are derived (xg / (minutes/90)) since the endpoint doesn't return them
                  directly. Grain is 1 row/player/snapshot. team_id resolution is via team_name_map.csv
                  (NULL if unmapped, or if the row's team_title is a comma-joined mid-season-transfer
                  string that intentionally fails the join — see docs/gold_data_contract.md).
                  understat_id is Understat's own native numeric player id, passed through unchanged —
                  used by silver.players to anchor identity for players football_data_org has no row
                  for. This model no longer resolves player_id itself (moved to
                  silver/player_team_season.sql, which depends on silver.players and would create a
                  circular ref if this model tried to depend on it too). position is normalized via
                  normalize_understat_position() from Understat's own multi-tag position string (e.g.
                  'D M S') into football_data_org's 4-value vocabulary, or NULL if the raw string is
                  just 'S' (substitute-only, no primary position recorded)."
    columns:
      - name: raw_player_name
        tests:
          - not_null
