version: 2

seeds:
  - name: player_extra_info
    description: "Manual backfill of nationality/date_of_birth/shirt_number for understat-anchored
                  players (no football_data_org squad row at all, e.g. Mohamed Salah, Leandro
                  Trossard) — football_data_org is otherwise the only source with these fields.
                  Keyed on the same computed player_id used in silver.players
                  (understat_id + 100000000). See
                  docs/superpowers/specs/2026-08-03-player-extra-info-seed-design.md."
    columns:
      - name: player_id
        tests:
          - unique
          - not_null
  - name: player_name_map
    description: "Manual name→id mapping for Understat/StatBunker players that don't auto-match
                  football_data_org by normalize_player_name(), including nickname and
                  word-order variants (e.g. Matty Cash / Matthew Cash, Hwang Heechan /
                  Hee-Chan Hwang) discovered during the 2026-08-04 triage. Grain uniqueness on
                  (source, raw_player_name, team_id) is enforced by
                  tests/assert_player_name_map_unique_grain.sql, not a column-level test, since
                  it's a composite key. See
                  docs/superpowers/specs/2026-08-04-player-triage-94-design.md."
  - name: understat_transfer_team_override
    description: "Manual understat_id→team_id override for players whose Understat team_title is
                  a comma-joined mid-season-transfer string (e.g. 'Angers,Rennes'). Which position
                  in that list is the current club is not consistent — verified manually across the
                  24 comma-joined cases known as of 2026-08-04, roughly half needed the first club
                  and half the last, and two different players ('Abakar Sylla' / 'Junior Mwanga')
                  shared the identical string 'Nantes,Strasbourg' with opposite correct answers —
                  so this can only be resolved per-player (understat_id), never by parsing the
                  string itself. stg_understat__player_stats checks this seed before falling back
                  to a 'last club in the list' guess for any not-yet-seeded case. Reactive/partial
                  by design, same pattern as player_name_map.csv."
    columns:
      - name: understat_id
        tests:
          - unique
          - not_null
